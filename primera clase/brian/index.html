<!-- le dice que es html 5-->
<!doctype html>
<!-- le decimos que el html es la raiz de todo y con lang que el idioma es español--<br> -->
<html lang="es">

    <head>
          <!-- ESTA LINEA DE CODIGO HACEMOS QUE RECONOZCA CARACTERES ESPECIALES COMO LA "Ñ"--<br> -->
        <meta charset="UTF-8">
    
        <!-- aqui hacemos que la pagina sea "RESPONSIVE" es decir que se adapte a cualquier tipo de pagina--<br> -->
        <meta name="viewport" content="width",initial-scale1.0>
        <title>aqui va el titulo quien lo diria</title>
        <!-- style nos permite codigo CSS para darle color y diseño a la pagina -->
        <style>
            /*con body se definen estilos generales para la pagina*/
            body{
                /*con esta linea de codigo le decimos que use uno de estos estilos de letra, y si no los tiene usa uno que este disponible en el sistema*/
                font-family:'Segoe UI', tahoma, Geneva, Verdana,sans-serif;
                /*con esta linea de codigo le damos color de fondo a toda la pagina*/
                background-color: black;
                display: flex;
                /*le decimos que el contenido estara en el centro horizontalmente*/
                justify-content: center;
                /*centra el contenido verticalmente*/
                align-items: center;
                /*con esto le decimos que ocupe el 100% de la pantalla*/
                height: 100vh;
                /*el grosor del margen*/
                margin: 0;
            
            }
            /* Forma básica 1: Un rectángulo con bordes redondeados para la tarjeta principal */
            .tarjeta{
                /*esta linea de codigo hace que el fondo de nuestra forma tena el color navy*/
                background-color: rgb(1, 46, 88);           
                padding: 30px;
                /*en esta linea de codigo le decimos que la figura va a tener los bordes redondeados*/
                border-radius: 55px;
                box-shadow: 0 10px 25px rgba(23, 112, 128, 0.568);
                text-align:center;
                max-width: 400px;
            }
            /**/
            .circulo-perfil{
                /*aqui esta el ancho del elemento*/
                width: 120px;
                /*alto del elemento (igual al ancho para que sea simetrico)*/
                height: 120px;
                /*degradado de colores en el fondo gracias a (linear-gradient())*/
                background:linear-gradient(12deg, #356ec4 0%, #081111 100%);
                border-radius:50%;
                margin:0 auto 20px auto;
                /* Estas tres líneas centran la letra 'A' exactamente en el medio del círculo */
                /*esta linea es para organizar los elementos hijo*/
                display: flex;
                /*esta  linea de codigo se encarga de que los elementos hijo se alinen de forma horizontal dentro del contenedor*/
                justify-content: center;
                /*esta linea de codigo se encarga de que os elemetos hijo se alinen de forma vertical dentro de contenedor*/
                align-items:center;
                
                color: white;
                font-size: 50px;
                font-weight:bold;

            }
            /*estilos para la targeta */
            h1{
                margin: 0 0 5px;
                color:rgb(255, 255, 255);

            }
            h3{
                margin: 0 0 15px;
                color:rgb(255, 251, 0);
                font-weight: normal;

            }
            p{
                color: rgb(255, 255, 255);
                line-height: 1.6;

            }
            </style>   
    </head>
    <!-- La etiqueta <body> contiene todo el contenido visual y estructural que el usuario verá en la pantalla -->
    <body>
        <div class="tarjeta">
            <!-- aqui usamos nuetro "circulo" creadp cpn css en la etiqueta <style> dentro pondremos la inicial de nuestro nombre -->
            <div class="circulo-perfil">
             B
            </div>
         <!-- en <h1> es el encabezado principal y mas grande. Usualmente se usa para el titulo  -->
         <h1>Brian</h1>
         <!-- <h3> es un encabezado de menor jerarquia, ideal para subtitulos como la carrera del estudiante-->
         <h3>SPEED RUN DE LO AVANZADO</h3>
            <!-- <p> representa un parrafo de texto comun -->
          <p>
            aprendi como poder usar css dentro de html
            y que se me daria mejor hacer todo lo que va a tener primero la pagina
            y al final ponerle colores figuras y animaciones 🤣🤣🤣
         </p> 
        </div>           
    </body>

            
</html>
